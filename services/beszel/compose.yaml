# More info at https://beszel.dev/guide/getting-started

services:
  beszel:
    image: henrygd/beszel:${BESZEL_VERSION}
    container_name: beszel
    environment:
      APP_URL: http://localhost:8090
    volumes:
      - ${BASE_DATA_PATH}/beszel/beszel_data:/beszel_data
      - ${BASE_DATA_PATH}/beszel/beszel_socket:/beszel_socket
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.beszel.rule=Host(`beszel.${ROOT_DOMAIN}`)"
      - "traefik.http.routers.beszel.entrypoints=websecure"
      - "traefik.http.routers.beszel.tls=true"
      - "traefik.http.services.beszel.loadbalancer.server.port=8090"
    ports:
      - "8090:8090"
    networks:
      custom_network:
        ipv4_address: 172.20.0.xx
    restart: unless-stopped
    # healthcheck:
    #   test: ['CMD', '/beszel', 'health', '--url', 'http://localhost:8010']
    #   interval: 120s
    #   start_period: 10s
    #   timeout: 5s

  beszel-agent:
    image: henrygd/beszel-agent:${BESZELAGENT_VERSION}
    container_name: beszel-agent
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://localhost:8090
      TOKEN: <token>
      KEY: "<key>"
    volumes:
      - ${BASE_DATA_PATH}/beszel/beszel_agent_data:/var/lib/beszel-agent
      - ${BASE_DATA_PATH}/beszel/beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
    networks:
      custom_network:
        ipv4_address: 172.20.0.xx
    restart: unless-stopped
    # healthcheck:
    #   test: ['CMD', '/agent', 'health']
    #   interval: 120s